<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="50%" stop-color="#130B24" />
      <stop offset="100%" stop-color="#0A0514" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#purpleGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#7C3AED" opacity="0.25" filter="url(#glow)" />

  <!-- Central Emblem: Scissors + Flow Sparkles -->
  <g transform="translate(256, 230) scale(1.4)" text-anchor="middle" filter="url(#glow)">
    <!-- Scissor Loop Left -->
    <circle cx="-38" cy="45" r="22" fill="none" stroke="url(#purpleGrad)" stroke-width="9" />
    <!-- Scissor Loop Right -->
    <circle cx="38" cy="45" r="22" fill="none" stroke="url(#purpleGrad)" stroke-width="9" />
    
    <!-- Scissor Blades -->
    <path d="M -22 30 L 35 -55 Q 38 -62 42 -55 L 0 0 Z" fill="url(#purpleGrad)" />
    <path d="M 22 30 L -35 -55 Q -38 -62 -42 -55 L 0 0 Z" fill="url(#accentGrad)" />

    <!-- Center Pivot Pivot -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="4" fill="#7C3AED" />

    <!-- Sparkle Stars -->
    <path d="M -55 -40 Q -55 -28 -43 -28 Q -55 -28 -55 -16 Q -55 -28 -67 -28 Q -55 -28 -55 -40 Z" fill="#F472B6" />
    <path d="M 55 -30 Q 55 -20 65 -20 Q 55 -20 55 -10 Q 55 -20 45 -20 Q 55 -20 55 -30 Z" fill="#C084FC" />
  </g>

  <!-- Typography: SALONFLOW -->
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">
    SALONFLOW
  </text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#A855F7" letter-spacing="4" text-anchor="middle">
    SALON MANAGEMENT OS
  </text>
</svg>
